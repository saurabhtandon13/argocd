## ---------------------------------------------------------------------------
## hubble-httproute
##
## Routes hubble.cloudapps.lvnlab.internal traffic to the Hubble UI service.
## ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-httproute
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-httproute
    app.kubernetes.io/part-of: cloudapps
    app.kubernetes.io/managed-by: platform-team
spec:
  parentRefs:
    - name: shared-gateway
      namespace: kube-system

  hostnames:
    - argocd.cloudapps.vkslab.internal

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
